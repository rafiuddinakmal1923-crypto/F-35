# Optional override: run Ollama on an NVIDIA GPU (needs Docker Desktop with the WSL 2 backend
# and a current NVIDIA driver on Windows; on Linux, the NVIDIA Container Toolkit).
# make.ps1 and the Makefile add this file automatically when nvidia-smi is found; set VG_GPU=0
# to force CPU. With a GPU, REPORT_MODE=live drafts the report assessment in seconds.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
