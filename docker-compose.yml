# VoltGuard AI R0. Lite profile (default): db, api, web, ollama, proxy.
# Full profile (optional): `docker compose --profile full up -d` adds the SDD's heavier services.
# Only the proxy publishes a port to the outside; the database listens on 127.0.0.1 only,
# for Power BI Desktop on the same laptop (read-only role, rpt_ views).

name: voltguard

services:
  db:
    image: timescale/timescaledb-ha:pg16          # PostgreSQL 16 + TimescaleDB + pgvector
    environment:
      POSTGRES_USER: voltguard
      POSTGRES_DB: voltguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make.ps1 setup first}
    volumes:
      - pgdata:/home/postgres/pgdata/data           # named volume, never a Windows bind mount
    ports:
      # Host port for Power BI only (containers use db:5432). Not 5432: a local PostgreSQL or a
      # Windows reserved port range often holds it. Change DB_HOST_PORT in .env if this one is taken.
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltguard -d voltguard"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_ROOT: /data
      HF_HOME: /models/hf
      DATABASE_URL: postgresql://voltguard_app:${APP_DB_PASSWORD}@db:5432/voltguard
      ADMIN_DATABASE_URL: postgresql://voltguard:${POSTGRES_PASSWORD}@db:5432/voltguard
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ${DATA_ROOT:-./.data}:/data
      - ${HF_HOME:-./.data/models/hf}:/models/hf
      - ./config:/app/config                        # admins edit YAML defaults without a rebuild
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - ${OLLAMA_MODELS:-./.data/models/ollama}:/root/.ollama
    restart: unless-stopped

  proxy:
    image: caddy:2.9.1
    ports:
      # WEB_PORT in .env if another program already uses 8080
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  # ------------------------------------------------------------------ public link (prompt 7.4)
  # Quick tunnel: random trycloudflare.com address; start once on demo day, never restart.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.4.2
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    depends_on: [proxy]
    restart: unless-stopped

  # Named tunnel: stable hostname on the team's Cloudflare domain (use this for judging).
  tunnel-named:
    profiles: ["tunnel-named"]
    image: cloudflare/cloudflared:2025.4.2
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    depends_on: [proxy]
    restart: unless-stopped

  # Named tunnel from the Cloudflare dashboard (Zero Trust -> Networks -> Tunnels): only a token is
  # needed (TUNNEL_TOKEN in .env); the public hostname -> http://proxy:80 is set in the dashboard.
  tunnel-token:
    profiles: ["tunnel-token"]
    image: cloudflare/cloudflared:2025.4.2
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [proxy]
    restart: unless-stopped

  # ------------------------------------------------------------------ full profile (optional)
  keycloak:
    profiles: ["full"]
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  minio:
    profiles: ["full"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: voltguard
      MINIO_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - minio:/data

  redis:
    profiles: ["full"]
    image: redis:7.4-alpine

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_ROOT: /data
      DATABASE_URL: postgresql://voltguard_app:${APP_DB_PASSWORD}@db:5432/voltguard
      ADMIN_DATABASE_URL: postgresql://voltguard:${POSTGRES_PASSWORD}@db:5432/voltguard
    command: ["python", "-m", "voltguard", "worker"]
    volumes:
      - ${DATA_ROOT:-./.data}:/data
    depends_on: [db, redis]

  airflow:
    profiles: ["full"]
    image: apache/airflow:2.10.5-python3.12
    command: ["standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./deploy/airflow/dags:/opt/airflow/dags:ro

  mlflow:
    profiles: ["full"]
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--backend-store-uri", "file:///mlruns"]
    volumes:
      - ${DATA_ROOT:-./.data}/mlruns:/mlruns

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v3.3.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.6.1

volumes:
  pgdata:
  minio:
