# Active source per canonical table (prompt 3.4).
# Values: simulated | london | upload:<dataset_name> | upload:<dataset_name>@v<N>
#   simulated  the simulation run named under `simulation.run`
#   london     London households from the London adapter (no voltage, phase or transformer meter)
#   upload:... a dataset loaded with `make.ps1 ingest -Dataset <name>` or the Data manager page
# Switching a source is a config change plus `make.ps1 pipeline`.
tables:
  transformer: simulated
  premise: simulated
  meter: simulated
  meter_reading: simulated
  meter_monthly_reading: simulated
  transformer_reading: simulated
  account_event: simulated
  district_weather: simulated
  duty_roster: simulated
  customer_pii: simulated
  inspection_outcome: simulated

# Household load profiles used by the simulator: synthetic | london
profiles: synthetic
london:
  households: 300              # default subset; set 0 for the full set
  zone_size: 60                # households grouped into one pseudo transformer zone (no real links in the data)
  region: CEN                  # region code the converted London zones are filed under
# Scale profiles to Malaysian monthly consumption seasonality: none | datagovmy
rescale: none
# Pattern model training data: synthetic | sgcc
pattern_training: sgcc

# Simulation run used when a table's source is `simulated`
simulation:
  run: demo

# Kaggle dataset slugs used by scripts/fetch_datasets.py (change here if a dataset moves)
downloads:
  london: jeanmidev/smart-meters-in-london
  sgcc: bensalem14/sgcc-dataset   # unverified slug: if it fails, follow the printed manual steps
