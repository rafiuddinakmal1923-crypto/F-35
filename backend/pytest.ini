[pytest]
pythonpath = .
testpaths = tests
addopts = -q -m "not e2e"
markers =
    db: needs PostgreSQL (started automatically from local binaries or TEST_DATABASE_URL)
    slow: runs several simulated scenarios
    e2e: browser end-to-end tests (run with -m e2e; needs Node, the built web app and Chromium)
filterwarnings =
    ignore::DeprecationWarning
